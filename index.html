<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>拼音聽力</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:light;--bg:#EFE9DF;--card:#F8F4EC;--ink:#2B1D1A;--muted:#8C7B70;--line:#D6CCBD;--hl:#9A3F22}
html,body{min-height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
#app{position:relative;max-width:950px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding:0 20px}
.top{position:relative;text-align:center;padding:26px 0 26px}
.home{position:absolute;left:20px;top:26px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:2px;transition:transform .15s,box-shadow .15s,border-color .15s}
.home:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.top h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(26px,4vw,40px);letter-spacing:.1em;line-height:1.3}
main{flex:1;display:flex;flex-direction:column;gap:22px}
.cover{justify-content:center;padding-top:72px!important;padding-bottom:48px!important}
.cover main{flex:none}
.cover .top{padding:0 0 clamp(34px,7vh,72px)}
.cover .top h1{font-size:clamp(34px,5.6vw,56px);letter-spacing:.12em}
.cover #v-menu,.cover #v-chal{gap:clamp(26px,4.5vh,44px)!important}
.seg{display:flex;justify-content:center;gap:10px}
.seg button{font-family:inherit;font-weight:700;font-size:clamp(16px,2vw,20px);cursor:pointer;border:1px solid var(--ink);border-radius:2px;padding:10px 26px;background:var(--card);color:var(--ink);transition:transform .15s,box-shadow .15s}
.seg button.on{background:var(--ink);color:var(--card)}
.seg button:hover{transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.sub{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(20px,2.6vw,28px);text-align:center;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.grid.two{grid-template-columns:repeat(2,1fr)}
.tile{font-family:inherit;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:10px;min-height:132px;padding:20px 22px;background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.tile:hover{border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.tile:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tile b{font-size:clamp(19px,2.3vw,24px);font-weight:700;letter-spacing:.04em}
.tile span{font-size:clamp(13px,1.5vw,15px);font-weight:300;letter-spacing:.06em;color:var(--muted);line-height:1.6}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.qtitle{font-family:"Noto Serif TC",serif;font-weight:700;font-size:clamp(18px,2.3vw,24px)}
.qcount{font-size:clamp(15px,1.9vw,20px);color:var(--muted);font-weight:500;white-space:nowrap}
.bar{height:4px;background:var(--line);margin-top:-10px}
.bar i{display:block;height:100%;width:0;background:var(--hl);transition:width .3s}
.stage{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:clamp(22px,3.4vw,40px);display:flex;flex-direction:column;align-items:center;gap:16px}
.stage p{font-size:clamp(13px,1.5vw,15px);color:var(--muted);letter-spacing:.06em}
button.act{font-family:inherit;font-weight:700;font-size:clamp(17px,2.1vw,24px);cursor:pointer;border:1px solid var(--ink);border-radius:2px;padding:14px 28px;transition:transform .1s,box-shadow .1s;display:inline-flex;align-items:center;justify-content:center;gap:12px}
button.act:hover:not(:disabled){transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.solid{background:var(--ink);color:var(--card)}
.ghost{background:var(--card);color:var(--ink)}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.opt{font-family:inherit;font-weight:500;font-size:clamp(26px,4vw,44px);letter-spacing:.02em;text-align:center;padding:clamp(18px,3vw,30px) 10px;background:var(--card);border:1px solid var(--line);border-radius:2px;color:var(--ink);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--ink);transform:translate(-2px,-2px);box-shadow:2px 2px 0 var(--ink)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ink);color:var(--card);border-color:var(--ink)}
.opt.bad{border-color:var(--hl);color:var(--hl)}
.fb{min-height:1.6em;text-align:center;font-weight:700;font-size:clamp(17px,2.1vw,24px)}
.fb.bad{color:var(--hl)}
.row{display:flex;gap:12px}
.row .act{flex:1}
.res{background:var(--card);border:1px solid var(--line);border-radius:2px;padding:clamp(28px,5vw,56px) 20px;text-align:center;display:flex;flex-direction:column;gap:22px;align-items:center}
.res .big{font-family:"Noto Serif TC",serif;font-weight:900;font-size:clamp(40px,7vw,72px);line-height:1.2}
.res .lbl{font-size:clamp(17px,2.1vw,24px);color:var(--muted);font-weight:500}
.res .row{width:100%;max-width:560px}
footer{text-align:center;padding:26px 0 26px;font-size:12px;letter-spacing:.06em;color:var(--muted)}
@media(max-width:640px){
  #app{padding:0 14px}
  .top{padding:16px 0 18px}
  .home{position:static;display:inline-block;margin-bottom:10px;font-size:14px}
  .cover{padding-top:24px!important}
  .cover .top h1{font-size:clamp(30px,8vw,40px)}
  .home:hover{transform:translate(-2px,-2px)}
  .grid{grid-template-columns:repeat(2,1fr)}
  .tile{min-height:112px;padding:16px}
  .opts.words{grid-template-columns:1fr}
  .row{flex-direction:column}
}
@media(prefers-reduced-motion:reduce){.tile,.opt,button.act,.seg button,.home,.bar i{transition:none}}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <a class="home" id="home" href="https://shelleytaiwan.github.io/learning-toolkits/">← 返回主頁</a>
    <h1 id="ttl">拼音聽力</h1>
  </header>
  <main>
    <section id="v-menu" style="display:flex;flex-direction:column;gap:22px">
      <div class="seg" id="seg"></div>
      <div class="grid" id="mods"></div>
    </section>
    <section id="v-chal" hidden style="flex-direction:column;gap:22px">
      <div class="sub" id="chal-ttl"></div>
      <div class="grid two" id="chal"></div>
      <div class="row"><button class="act ghost" id="chal-back"></button></div>
    </section>
    <section id="v-quiz" hidden style="flex-direction:column;gap:22px">
      <div class="qhead"><div class="qtitle" id="q-title"></div><div class="qcount" id="q-count"></div></div>
      <div class="bar"><i id="q-bar"></i></div>
      <div class="stage">
        <button class="act solid" id="q-play"></button>
        <p id="q-hint"></p>
      </div>
      <div class="opts" id="q-opts"></div>
      <div class="fb" id="q-fb"></div>
      <div class="row">
        <button class="act solid" id="q-next" hidden></button>
        <button class="act ghost" id="q-quit"></button>
      </div>
    </section>
    <section id="v-res" hidden style="flex-direction:column;gap:22px">
      <div class="res">
        <div class="lbl" id="r-lbl"></div>
        <div class="big" id="r-big"></div>
        <div class="row"><button class="act solid" id="r-again"></button><button class="act ghost" id="r-menu"></button></div>
      </div>
    </section>
  </main>
  <footer>Shelleytaiwan 製作 · 2027 · 請勿商用</footer>
</div>

],
m5b:[

'3 gu:古 gua:寡 guo:果 gui:鬼',

'4 ku:酷 kua:跨 kuo:擴/扩 kui:愧',

// 詞語二選一（兩個詞的繁體、簡體、拼音）
const WORDS=[
['好棒','好棒','hǎo bàng','好胖','好胖','hǎo pàng'],
['抹油','抹油','mǒ yóu','馬油','马油','mǎ yóu'],
['大腦','大脑','dà nǎo','大老','大老','dà lǎo'],
['飛機','飞机','fēi jī','灰機','灰机','huī jī'],
['牛奶','牛奶','niú nǎi','流奶','流奶','liú nǎi'],
['奶奶','奶奶','nǎi nai','賴賴','赖赖','lài lài'],
['老師','老师','lǎo shī','老司','老司','lǎo sī'],
['四十','四十','sì shí','事實','事实','shì shí'],
['基金','基金','jī jīn','資金','资金','zī jīn'],
['練習','练习','liàn xí','念習','念习','niàn xí'],
['藍色','蓝色','lán sè','男色','男色','nán sè'],
['六個','六个','liù ge','肉個','肉个','ròu gè'],
['綠色','绿色','lǜ sè','玉色','玉色','yù sè'],
['熱情','热情','rè qíng','樂情','乐情','lè qíng'],
['日本','日本','rì běn','二本','二本','èr běn'],
['村莊','村庄','cūn zhuāng','春裝','春装','chūn zhuāng'],
['草原','草原','cǎo yuán','吵原','吵原','chǎo yuán'],
['參加','参加','cān jiā','餐加','餐加','chān jiā'],
['找到','找到','zhǎo dào','早到','早到','zǎo dào'],
['知事','知事','zhī shì','滋事','滋事','zī shì'],
['支持','支持','zhī chí','自持','自持','zì chí'],
['製造','制造','zhì zào','自造','自造','zì zào'],
['出去','出去','chū qù','粗去','粗去','cū qù'],
['時間','时间','shí jiān','席間','席间','xí jiān'],
['心情','心情','xīn qíng','星情','星情','xīng qíng'],
['相信','相信','xiāng xìn','相印','相印','xiāng yìn'],
['英雄','英雄','yīng xióng','因雄','因雄','yīn xióng'],
['應用','应用','yìng yòng','硬要','硬要','yìng yào'],
['溫暖','温暖','wēn nuǎn','溫軟','温软','wēn ruǎn'],
['女人','女人','nǚ rén','旅人','旅人','lǚ rén']
];
// 發音只會唸「真的詞」：若兩個都是真詞（序號見下），才會隨機唸其中一個；否則一律唸第一個（真詞）
const BOTH=[1,2,8,9,15,16,19,20,28,30]; // 第幾題（從 1 起算）兩個詞都是真詞


/* ============ 工具函式 ============ */
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const TM={a:'āáǎà',e:'ēéěè',i:'īíǐì',o:'ōóǒò',u:'ūúǔù'};
function mark(s,t){let i=s.indexOf('a');if(i<0)i=s.indexOf('e');if(i<0)i=s.indexOf('o');if(i<0)i=Math.max(s.lastIndexOf('i'),s.lastIndexOf('u'));return s.slice(0,i)+TM[s[i]][t-1]+s.slice(i+1)}
const initOf=s=>(s.match(/^(zh|ch|sh|[bpmfdtnlgkhjqxrzcsyw])/)||[''])[0];
function item(tok){const[s,h]=tok.split(':');const p=h.split('/');return{syl:s,init:initOf(s),hz:[p[0],p[1]||p[0]]}}
function parse(lines){return lines.map(l=>{const a=l.split(' ');return{t:+a[0],items:a.slice(1).map(item)}})}
const G={};['m1','m2a','m2b','m3','m4a','m5a','m5b'].forEach(k=>G[k]=parse(RAW[k]));

function mkQ(g,target,pref){
  const rest=g.items.filter(x=>x!==target);
  const pi=(pref||[]).map(p=>rest.find(x=>x.init===p)).filter(Boolean);
  const others=pi.concat(shuffle(rest.filter(x=>!pi.includes(x)))).slice(0,3);
  return{opts:shuffle([target].concat(others)).map(x=>({py:mark(x.syl,g.t),ok:x===target})),say:target.hz};
}
function sample(groups,n,okFn,prefFn){
  const used=new Set(),out=[];let guard=0;
  while(out.length<n&&guard++<20){
    for(const g of shuffle(groups)){
      if(out.length>=n)break;
      const c=g.items.filter(x=>(!okFn||okFn(x))&&!used.has(x.syl+g.t));
      if(!c.length)continue;
      const t=rnd(c);used.add(t.syl+g.t);
      out.push(mkQ(g,t,prefFn?prefFn(t):null));
    }
  }
  return out;
}
const P1={b:['p'],p:['b'],d:['t'],t:['d'],g:['k'],k:['g']};
const P2={zh:['ch','sh','z'],ch:['zh','sh','c'],sh:['zh','ch','s'],z:['c','s','zh'],c:['z','s','ch'],s:['z','c','sh']};
function genIn(n){
  const cand=[];
  for(const t in RAW.m4b)for(const ini in RAW.m4b[t])cand.push({t:+t,ini});
  const out=[],used=new Set();let guard=0;
  while(out.length<n&&guard++<20){
    for(const c of shuffle(cand)){
      if(out.length>=n)break;
      const A=RAW.m4b[c.t][c.ini].map(item);
      const pick=rnd(A);const key=pick.syl+c.t;if(used.has(key))continue;used.add(key);
      const bi=rnd(Object.keys(RAW.m4b[c.t]).filter(k=>k!==c.ini));
      const B=RAW.m4b[c.t][bi].map(item);
      out.push({opts:shuffle(A.concat(B)).map(x=>({py:mark(x.syl,c.t),ok:x===pick})),say:pick.hz});
    }
  }
  return out;
}
const GEN={
  m1:n=>sample(G.m1,n,null,x=>P1[x.init]),
  m2:n=>shuffle(sample(G.m2a,Math.ceil(n/2),null,x=>P2[x.init]).concat(sample(G.m2b,Math.floor(n/2),x=>x.init!=='y'))),
  m3:n=>sample(G.m3,n),
  m4:n=>{const a=Math.round(n*0.6);return shuffle(sample(G.m4a,a).concat(genIn(n-a)))},
  m5:n=>shuffle(sample(G.m5a,Math.ceil(n/2)).concat(sample(G.m5b,Math.floor(n/2))))
};
function genMixS(){
  const r=[],seen=new Set();
  ['m1','m2','m3','m4','m5'].forEach(k=>{
    let got=0;
    for(const q of GEN[k](10)){
      const key=q.opts.find(o=>o.ok).py;
      if(seen.has(key))continue;
      seen.add(key);r.push(q);if(++got>=4)break;
    }
  });
  return shuffle(r);
}
function genWords(){
  return shuffle(WORDS).map(w=>{
    const idx=WORDS.indexOf(w)+1;const first=BOTH.includes(idx)?Math.random()<.5:true;
    const a={py:w[2],hz:[w[0],w[1]]},b={py:w[5],hz:[w[3],w[4]]};
    const target=first?a:b;
    return{words:true,opts:shuffle([a,b]).map(x=>({py:x.py,ok:x===target})),say:target.hz};
  });
}

/* ============ 語音（沿用原 18 的瀏覽器 TTS） ============ */
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  if(lang==='s'){
    for(const re of [/Ting-?Ting|婷婷/i,/Yun-?yang|雲揚|云扬/i,/Mei-?Jia|美佳/i]){const v=vs.find(v=>re.test(v.name));if(v)return v}
    return vs.find(v=>v.lang==='zh-CN')||vs.find(v=>v.lang.startsWith('zh'))||null;
  }
  return vs.find(v=>v.lang==='zh-TW'&&/Taiwan|Mei-?Jia|Tingting|Yating|美佳/i.test(v.name))||vs.find(v=>v.lang==='zh-TW')||vs.find(v=>v.lang.startsWith('zh'))||null;
}
function speak(hz){
  if(!('speechSynthesis' in window))return;
  const text=hz[lang==='s'?1:0];
  const go=()=>{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang=lang==='s'?'zh-CN':'zh-TW';u.rate=.8;
    const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
    speechSynthesis.speak(u);
  };
  if(speechSynthesis.getVoices().length)go();
  else{speechSynthesis.onvoiceschanged=()=>{speechSynthesis.onvoiceschanged=null;go()};setTimeout(()=>{if(speechSynthesis.onvoiceschanged){speechSynthesis.onvoiceschanged=null;go()}},400)}
}

/* ============ 畫面 ============ */
const $=id=>document.getElementById(id);
const VIEWS=['v-menu','v-chal','v-quiz','v-res'];
function show(id){VIEWS.forEach(v=>{const e=$(v);e.hidden=v!==id;e.style.display=v===id?'flex':'none'});$('app').classList.toggle('cover',id==='v-menu'||id==='v-chal');window.scrollTo(0,0)}
function tile(name,desc,fn){const b=document.createElement('button');b.className='tile';b.type='button';const n=document.createElement('b');n.textContent=name;const d=document.createElement('span');d.textContent=desc;b.append(n,d);b.onclick=fn;return b}
function renderStatic(){
  document.documentElement.lang=lang==='s'?'zh-CN':'zh-TW';
  document.title=T('title');$('ttl').textContent=T('title');$('home').textContent=T('back');
  const seg=$('seg');seg.innerHTML='';
  [['t','繁體'],['s','简体']].forEach(([k,n])=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.className=lang===k?'on':'';b.onclick=()=>{lang=k;try{localStorage.setItem('pylis_lang',k)}catch(e){}renderStatic()};seg.appendChild(b)});
  const m=$('mods');m.innerHTML='';
  ['m1','m2','m3','m4','m5'].forEach(k=>m.appendChild(tile(T(k),DESC[k],()=>start(k))));
  m.appendChild(tile(T('chal'),T('chalD'),()=>{show('v-chal')}));
  $('chal-ttl').textContent=T('chal');
  const c=$('chal');c.innerHTML='';
  c.appendChild(tile(T('mixS'),T('mixSd'),()=>start('mixS')));
  c.appendChild(tile(T('mixW'),T('mixWd'),()=>start('mixW')));
  $('chal-back').textContent=T('menu');
  $('q-play').innerHTML='<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>'+T('play')+'</span>';
  $('q-hint').textContent=T('hint');$('q-quit').textContent=T('menu');
  $('r-again').textContent=T('again');$('r-menu').textContent=T('menu');
  if(cur.key&&!$('v-quiz').hidden)renderQ(true);
}

/* ============ 測驗流程 ============ */
let cur={key:null,qs:[],i:0,score:0,done:false};
function titleOf(k){return k==='mixS'?T('chal')+'・'+T('mixS').split('（')[0]:k==='mixW'?T('chal')+'・'+T('mixW').split('（')[0]:T(k)}
function start(k){
  if(window.speechSynthesis)speechSynthesis.cancel();
  const qs=k==='mixS'?genMixS():k==='mixW'?genWords():GEN[k](20);
  cur={key:k,qs,i:0,score:0,done:false};
  show('v-quiz');renderQ();
}
function renderQ(keepState){
  const q=cur.qs[cur.i],N=cur.qs.length;
  $('q-title').textContent=titleOf(cur.key);
  $('q-count').textContent=(cur.i+1)+' / '+N+'　'+T('score')+' '+cur.score;
  $('q-bar').style.width=(cur.i/N*100)+'%';
  const o=$('q-opts');o.className='opts'+(q.words?' words':'');
  if(keepState&&cur.done)return;
  o.innerHTML='';$('q-fb').textContent='';$('q-fb').className='fb';$('q-next').hidden=true;cur.done=false;
  q.opts.forEach(op=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=op.py;b.onclick=()=>answer(op,b);o.appendChild(b)});
  $('q-next').textContent=cur.i===N-1?T('finish'):T('next');
}
function answer(op,btn){
  if(cur.done)return;cur.done=true;
  const q=cur.qs[cur.i],btns=[...$('q-opts').children],fb=$('q-fb');
  q.opts.forEach((x,i)=>{btns[i].disabled=true;if(x.ok)btns[i].classList.add('ok')});
  if(op.ok){cur.score++;fb.textContent=T('right')}
  else{btn.classList.add('bad');fb.className='fb bad';fb.textContent=T('wrong')+q.opts.find(x=>x.ok).py}
  $('q-count').textContent=(cur.i+1)+' / '+cur.qs.length+'　'+T('score')+' '+cur.score;
  $('q-bar').style.width=((cur.i+1)/cur.qs.length*100)+'%';
  $('q-next').hidden=false;
}
$('q-play').onclick=()=>speak(cur.qs[cur.i].say);
$('q-next').onclick=()=>{
  if(cur.i<cur.qs.length-1){cur.i++;renderQ()}
  else{$('r-lbl').textContent=titleOf(cur.key);$('r-big').textContent=cur.score+' / '+cur.qs.length;show('v-res')}
};
$('q-quit').onclick=()=>{if(window.speechSynthesis)speechSynthesis.cancel();cur.key=null;show('v-menu')};
$('chal-back').onclick=()=>show('v-menu');
$('r-again').onclick=()=>start(cur.key);
$('r-menu').onclick=()=>{cur.key=null;show('v-menu')};
$('home').onclick=e=>{e.preventDefault();if(window.speechSynthesis)speechSynthesis.cancel();location.href='https://shelleytaiwan.github.io/learning-toolkits/'};

renderStatic();show('v-menu');
</script>
